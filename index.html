<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake — Nokia Style</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#c4cfa1">
<meta name="description" content="A lightweight, cross-platform Snake game inspired by the classic Nokia 3310.">

<!-- PWA -->
<link rel="manifest" href="manifest.json">

<!-- iOS home-screen support -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Snake">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="phone">
  <div id="screen-bezel">
    <div id="topbar">
      <span id="score">SCORE: 0</span>
      <span id="highscore">HI: 0</span>
    </div>
    <canvas id="game" width="240" height="240"></canvas>
    <div id="overlay" class="hidden">
      <div id="overlay-title">SNAKE</div>
      <div id="overlay-msg">Press any key or tap to start</div>
    </div>
  </div>

  <div id="controls" aria-hidden="false">
    <button id="btn-up" class="dpad" aria-label="Up">▲</button>
    <div class="dpad-row">
      <button id="btn-left" class="dpad" aria-label="Left">◀</button>
      <button id="btn-down" class="dpad" aria-label="Down">▼</button>
      <button id="btn-right" class="dpad" aria-label="Right">▶</button>
    </div>
  </div>

  <p id="disclaimer">Unofficial fan project inspired by classic 2000s mobile Snake games. Not affiliated with, endorsed by, or sponsored by Nokia. All trademarks belong to their respective owners.</p>
</div>

<script src="game.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(() => {});
    });
  }
</script>
</body>
</html>
